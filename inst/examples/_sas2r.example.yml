# ==============================================================================
# sas2r Project Configuration (_sas2r.yml)
# ==============================================================================
# All sections are optional. Relative paths are resolved relative to the
# directory containing this configuration file.
#
# SOURCE AUTHORITY & PRECEDENCE:
# 1. An accessible point-of-use source LIBNAME in SAS code is authoritative.
# 2. Configured libraries fill an absent or unusable SAS source binding.
# 3. A missing dataset member under an accessible source root does NOT fall
#    through to a configured copy.
# 4. Project-local, absolute, and fileref %INCLUDE targets need no configuration;
#    includes.roots is searched only when source-relative resolution fails.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SAS Library Paths
# ------------------------------------------------------------------------------
# Map SAS librefs to filesystem directory paths. Both scalar and expanded
# dictionary syntaxes are supported.
libraries:
  # Scalar syntax (shorthand: libref -> path)
  adam: data/adam

  # Expanded syntax with engine and write format
  sdtm:
    path: data/sdtm
    engine: sas7bdat      # Input format: sas7bdat | rds | xpt | csv | duckdb
    write: rds            # Output format for emitted R code: rds | xpt

  work:
    path: data/work
    engine: rds
    write: rds

# ------------------------------------------------------------------------------
# 2. Output Contracts & Overrides (Optional)
# ------------------------------------------------------------------------------
# Explicitly declare expected output datasets and TLF artifacts to evaluate
# at the migration gate.
outputs:
  datasets:
    - adam.adsl
    - adam.adae
  tlfs:
    - outputs/table1.pdf
    - outputs/figure1.pdf

# ------------------------------------------------------------------------------
# 3. Macro Search Path
# ------------------------------------------------------------------------------
# Directories containing external SAS autocall macros (*.sas).
macros:
  search_path:
    - macros
    - /mount/shared/macros

# ------------------------------------------------------------------------------
# 4. Include Fallback Roots
# ------------------------------------------------------------------------------
# Search roots for %INCLUDE targets. Used ONLY when a target file cannot be
# resolved relative to the including SAS file or project root.
includes:
  roots:
    - includes
    - /mount/shared/sas-includes

# ------------------------------------------------------------------------------
# 5. Autoexec & Environment
# ------------------------------------------------------------------------------
# SAS autoexec files to ingest for global macro variables, options, and setup.
environment:
  autoexec:
    - autoexec.sas

# ------------------------------------------------------------------------------
# 6. LLM Provider Configuration (Optional)
# ------------------------------------------------------------------------------
# Connect to an LLM provider for agent translation and code review.
# Requires ellmer >= 0.4.2; ellmer 0.5.0 is recommended for new installations.
# Version-specific notes use 0.4.2 as the minimum supported baseline, not a pin.
# Twelve native ellmer providers are supported: openai, anthropic, bedrock,
# azure, databricks, deepseek, github, gemini, vertex, ollama, posit, snowflake.
# NOTE: Secrets must NEVER be placed in this file. Provide them via environment
# variables (e.g., OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, GITHUB_PAT).
# NOTE: github (GitHub Models) was retired upstream on 2026-07-30 and needs
# ellmer < 0.5.0; on newer ellmer sas2r refuses it before building a request.
#
# Evaluate Gemini Flash or DeepSeek Flash first; use frontier models when needed.
# Keep the same source-based review and output checks with every model.
# These are starting profiles, not a guarantee of translation quality.
# Development branch: Gemini/DeepSeek tool-continuation history still needs
# transport work and validation before study use; see docs/llm-providers.md.
# Keep exactly one llm block active.
# High reasoning is explicit where ellmer 0.4.2 maps it. DeepSeek uses its
# documented server default; requesting explicit effort stops on this connector.
# max_output_tokens is a per-response allowance for reasoning plus the answer
# where the provider counts both. Use 65536 for this Gemini profile, 131072 for
# DeepSeek, or 32768 for OpenAI/Claude; adjust within the model/connector limit.
# Larger ceilings can increase cost and time; they do not guarantee completion.
# Startup verifies explicit settings and sets their effective capabilities.
# Unsupported, ignored, or unverified settings stop the run before agent work.
# Probe calls share the run budget; sas_preflight() stays offline.
# Do not add temperature/top_p overrides to these reasoning profiles.
# Cloud/local providers and connector limitations: docs/llm-providers.md.
# timeout_seconds bounds each HTTP transfer attempt, not inactivity: receiving
# output does not reset it. The package default is 300 seconds; these profiles
# allow 900 seconds (1800 for DeepSeek) for reasoning and tool use.
# max_tries defaults to 1. Larger values add transport attempts beneath sas2r's
# own retries and can multiply elapsed time and ambiguous spend.
#
# Active example: Gemini Flash — first evaluation (GEMINI_API_KEY or GOOGLE_API_KEY)
llm:
  provider: gemini
  auth_mode: api_key
  model: gemini-3.8-flash
  reasoning_effort: high
  max_output_tokens: 65536
  capabilities:
    structured_output: fallback
    tool_calling: native
  timeout_seconds: 900
  max_tries: 1

# Alternative: DeepSeek Flash — first evaluation (DEEPSEEK_API_KEY)
# llm:
#   provider: deepseek
#   auth_mode: api_key
#   model: deepseek-flash              # or deepseek-v4-pro
#   # Server thinking remains enabled; ellmer 0.4.2 does not forward effort here.
#   max_output_tokens: 131072
#   capabilities:
#     structured_output: fallback
#     tool_calling: native
#     reasoning_effort: unsupported    # connector limitation, not thinking disabled
#   timeout_seconds: 1800
#   max_tries: 1

# Alternative: OpenAI Luna — cost-focused starting model (OPENAI_API_KEY)
# llm:
#   provider: openai
#   auth_mode: api_key
#   model: gpt-5.6-luna
#   reasoning_effort: high
#   max_output_tokens: 32768
#   capabilities:
#     structured_output: native
#     tool_calling: native
#   timeout_seconds: 900
#   max_tries: 1

# Alternative: Anthropic (ANTHROPIC_API_KEY)
# llm:
#   provider: anthropic
#   auth_mode: api_key
#   model: claude-sonnet-4-6
#   reasoning_effort: high
#   max_output_tokens: 32768
#   capabilities:
#     structured_output: fallback
#     tool_calling: native
#   cache: 1h
#   timeout_seconds: 900
#   max_tries: 1

# ------------------------------------------------------------------------------
# 7. Usage Budget & Policy (Optional)
# ------------------------------------------------------------------------------
# Default is mode: observe, max_usd: Inf (audits usage without stopping calls).
# budget:
#   mode: observe                       # observe | soft | strict
#   max_calls: 50
#   max_output_tokens: 131072           # per-request admission ceiling; must be
#                                       # >= llm.max_output_tokens when both are set
#   max_usd: 5.00
#   max_retries: 2                      # sas2r-level; see llm.max_tries
#   max_tool_calls: 500
#   max_wall_time: 7200                 # denies new calls after this time; does not interrupt an in-flight request

# ------------------------------------------------------------------------------
# 8. Concurrent Translation Workflows
# ------------------------------------------------------------------------------
# Counts whole program-or-macro workflows, including their review and repair.
# Start at 1; compare with 2 after checking outputs, quota and memory.
# Local execution and repair stay serial. This is not a CPU or agent-role count.
migration:
  max_parallel_translations: 1

# ------------------------------------------------------------------------------
# 9. Data & Model Privacy Boundary
# ------------------------------------------------------------------------------
# Models receive SAS/R code, input schema metadata, helper interfaces and errors.
# Reference comparison reports and digests stay local, outside authoring tools.
# agent_evidence = "bounded" permits capped candidate-output previews, which may
# contain row numbers, key values, cell values and subject identifiers.
# The default "code_only" omits previews; code and errors may still contain data.
# Dataset generation and comparison run locally. Confirm your model endpoint
# meets your organization's data residency and governance requirements.
